<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generador de Presupuestos ESI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:14px;background:#f5f5f5}
#app{max-width:880px;margin:0 auto;padding:1rem}
.card{background:#fff;border:0.5px solid #ddd;border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.card h2{font-size:14px;font-weight:700;color:#1a3c6e;border-bottom:1px solid #e8e8e8;padding-bottom:8px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{border:0.5px solid #ccc;border-radius:6px;padding:7px 10px;font-size:13px;font-family:Arial;color:#222;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#1a3c6e}
.field textarea{resize:vertical;min-height:80px}
.ac-wrap{position:relative}
.ac-wrap input{width:100%}
.dd{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;border-radius:6px;z-index:999;max-height:220px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.12);margin-top:2px}
.dd-item{padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:0.5px solid #f0f0f0}
.dd-item:hover{background:#eef3fb}
.dd-ruc{color:#999;font-size:11px;margin-left:6px}
.dd-rubro{color:#1a3c6e;font-size:10px;display:block;margin-top:1px}
.items-table{width:100%;border-collapse:collapse;font-size:12px}
.items-table th{background:#1a3c6e;color:#fff;padding:7px 8px;text-align:left;font-weight:600;font-size:11px}
.items-table td{padding:6px 8px;border-bottom:0.5px solid #eee;vertical-align:top}
.items-table td input,.items-table td textarea{border:0.5px solid #ccc;border-radius:4px;padding:4px 6px;font-size:12px;font-family:Arial;width:100%}
.items-table td textarea{min-height:70px;resize:vertical}
.btn{border:none;border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:Arial;font-weight:600}
.btn-primary{background:#1a3c6e;color:#fff}.btn-primary:hover{background:#15305a}
.btn-danger{background:#e53935;color:#fff;font-size:11px;padding:4px 8px;border-radius:4px}
.btn-success{background:#2e7d32;color:#fff;padding:11px 28px;font-size:14px}
.btn-secondary{background:#eee;color:#333}
.btn-outline{background:#fff;color:#1a3c6e;border:1px solid #1a3c6e;padding:6px 14px;font-size:12px}
.total-bar{background:#f0f4ff;border-radius:8px;padding:10px 14px;display:flex;justify-content:flex-end;gap:12px;margin-top:8px;font-size:13px;font-weight:700;color:#1a3c6e}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:1.5rem;width:480px;max-width:95vw}
.modal h3{font-size:15px;color:#1a3c6e;margin-bottom:14px;font-weight:700}
.modal .field{margin-bottom:10px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.9);z-index:3000;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:15px;color:#1a3c6e;font-weight:600}
#overlay.show{display:flex}
.spinner{width:40px;height:40px;border:4px solid #ddd;border-top:4px solid #1a3c6e;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#pres-wrap{position:absolute;left:-9999px;top:0;width:794px;font-family:Arial,sans-serif;font-size:11px;color:#222;background:#fff}
.pres{width:794px;min-height:1123px;background:#fff;padding:28px 36px;position:relative}
.pres-hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #b0001e;padding-bottom:10px;margin-bottom:14px}
.pres-logo{font-size:20px;font-weight:900;color:#1a3c6e;letter-spacing:-1px}
.pres-logo span{color:#b0001e}
.pres-svc{font-size:8.5px;color:#444;text-align:right;line-height:1.7}
.pres-num{font-size:13px;font-weight:700;text-align:center;text-decoration:underline;margin-bottom:12px}
.pres-meta{display:flex;justify-content:space-between;margin-bottom:8px;font-size:10.5px}
.pmr{display:flex;gap:6px;margin-bottom:2px}
.pml{font-weight:700;min-width:68px}
.pres-table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:9.5px}
.pres-table th{background:#1a3c6e;color:#fff;padding:5px 6px;text-align:center;font-weight:700}
.pres-table td{border:0.5px solid #ccc;padding:5px 6px;vertical-align:top}
.tcen{text-align:center}.tnum{text-align:right}
.pres-total td{background:#f0f0f0;font-weight:700;border-top:1.5px solid #999}
.pres-cond h4{font-size:10.5px;font-weight:700;text-decoration:underline;text-align:center;margin:12px 0 8px}
.pres-cond ol{padding-left:16px;font-size:9.5px;line-height:1.75}
.pres-cond li{margin-bottom:2px}
.hi{color:#b0001e;font-weight:700}
.ctas{margin:4px 0 6px 16px;font-size:9px;line-height:1.7}
.firma-blk{display:inline-block;text-align:center;margin-top:24px}
.firma-ln{border-top:1px solid #333;width:190px;margin:3px 0 2px}
.pres-pie{position:absolute;bottom:14px;left:0;right:0;padding:6px 36px 0;border-top:1px solid #b0001e;font-size:8.5px;color:#555;display:flex;justify-content:space-between}
.condgen-title{font-size:11px;font-weight:700;text-decoration:underline;text-align:center;margin-bottom:10px}
.condgen-sub{font-size:10px;font-weight:700;text-align:center;margin:8px 0 4px}
.condgen-ol{padding-left:16px;font-size:9.5px;line-height:1.75;margin-bottom:6px}
</style>
</head>
<body>
<div id="overlay"><div class="spinner"></div><span id="overlay-msg">Generando PDF...</span></div>
<div id="app">
  <div style="display:flex;align-items:center;gap:12px;padding:1rem 0 .5rem">
    <div style="font-size:22px;font-weight:900;color:#1a3c6e;letter-spacing:-1px">E<span style="color:#b0001e">S</span>I</div>
    <div><div style="font-size:15px;font-weight:700;color:#1a3c6e">Generador de Presupuestos</div>
    <div style="font-size:11px;color:#888">Electronic Systems International S.A.</div></div>
  </div>
  <div class="card"><h2>Datos generales</h2>
    <div class="grid3">
      <div class="field"><label>N° Presupuesto</label><input type="text" id="numPres" placeholder="Ej: 075-25"></div>
      <div class="field"><label>Fecha</label><input type="date" id="fecha"></div>
      <div class="field"><label>Asesora comercial</label>
        <div style="display:flex;gap:6px">
          <select id="asesora" style="flex:1;border:0.5px solid #ccc;border-radius:6px;padding:7px 10px;font-size:13px"></select>
          <button class="btn btn-outline" onclick="abrirModalAsesora()">+</button>
        </div>
      </div>
    </div>
  </div>
  <div class="card"><h2>Cliente</h2>
    <div class="grid2" style="margin-bottom:12px">
      <div class="field"><label>Razón social</label>
        <div style="display:flex;gap:6px">
          <div class="ac-wrap" style="flex:1">
            <input type="text" id="empresa" placeholder="Buscar empresa..." autocomplete="off" oninput="filtrarEmpresas()" onfocus="filtrarEmpresas()">
            <div class="dd" id="dd" style="display:none"></div>
          </div>
          <button class="btn btn-outline" onclick="abrirModalCliente()">+</button>
        </div>
      </div>
      <div class="field"><label>RUC</label><input type="text" id="ruc" placeholder="20XXXXXXXXX"></div>
    </div>
    <div class="grid3" style="margin-bottom:12px">
      <div class="field"><label>Planta / sede</label><input type="text" id="planta" placeholder="Ej: CALLAO"></div>
      <div class="field"><label>Contacto</label><input type="text" id="contacto" placeholder="Nombre"></div>
      <div class="field"><label>Cargo</label><input type="text" id="cargo" placeholder="Ej: ING. TRAMO 3"></div>
    </div>
    <div class="field" style="max-width:220px"><label>Teléfono</label><input type="text" id="telCliente" placeholder="999 000 000"></div>
  </div>
  <div class="card"><h2>Ítems del servicio</h2>
    <table class="items-table">
      <thead><tr>
        <th style="width:38px">#</th><th style="width:90px">Tipo serv.</th><th style="width:110px">Equipo</th>
        <th>Descripción</th><th style="width:80px">Lugar</th><th style="width:50px">Cant.</th>
        <th style="width:100px">P. Unit. ($)</th><th style="width:42px"></th>
      </tr></thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <div style="margin-top:10px"><button class="btn btn-primary" onclick="addItem()">+ Agregar ítem</button></div>
    <div class="total-bar">TOTAL SIN IGV: <span id="totalLive">$ 0.00</span></div>
  </div>
  <div class="card"><h2>Condiciones comerciales</h2>
    <div class="grid3">
      <div class="field"><label>Forma de pago</label>
        <select id="formaPago"><option>CONTADO</option><option>30 DÍAS</option><option>45 DÍAS</option><option selected>60 DÍAS</option><option>50% ADELANTO / 50% CONTRA ENTREGA</option></select>
      </div>
      <div class="field"><label>Validez de la oferta</label>
        <select id="validez"><option>Quince (15 días)</option><option>Treinta (30 días)</option></select>
      </div>
      <div class="field"><label>Tiempo estimado</label><input type="text" id="tiempoEst" placeholder="Ej: 1 DÍA"></div>
    </div>
    <div class="grid2" style="margin-top:12px">
      <div class="field"><label>Personal técnico (N°)</label><input type="number" id="personal" value="2" min="1"></div>
      <div class="field"><label>Días anticipación para coordinar</label><input type="number" id="diasCoord" value="2" min="1"></div>
    </div>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:2rem">
    <button class="btn btn-success" onclick="generarPDF()">⬇ Descargar PDF</button>
  </div>
</div>

<div class="modal-bg" id="modalCliente">
  <div class="modal"><h3>Agregar nuevo cliente</h3>
    <div class="field"><label>Razón social *</label><input type="text" id="nc-empresa"></div>
    <div class="grid2">
      <div class="field"><label>RUC *</label><input type="text" id="nc-ruc"></div>
      <div class="field"><label>Planta / sede</label><input type="text" id="nc-planta"></div>
    </div>
    <div class="field"><label>Rubro</label><input type="text" id="nc-rubro"></div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="cerrarModal('modalCliente')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarCliente()">Guardar</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalAsesora">
  <div class="modal"><h3>Agregar nueva asesora</h3>
    <div class="field"><label>Nombre completo *</label><input type="text" id="na-nombre"></div>
    <div class="field"><label>Teléfono</label><input type="text" id="na-tel"></div>
    <div class="field"><label>Correo electrónico</label><input type="text" id="na-email"></div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="cerrarModal('modalAsesora')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarAsesora()">Guardar</button>
    </div>
  </div>
</div>

<div id="pres-wrap">
  <div class="pres" id="pres-p1"></div>
  <div class="pres" id="pres-p2"></div>
</div>

function renderAsesoras(){
  const sel=document.getElementById('asesora');
  const cur=sel.value;
  sel.innerHTML=ASESORAS.map(a=>`<option value="${a.n}">${a.n}</option>`).join('');
  if(cur)sel.value=cur;
}

renderAsesoras();
document.getElementById('fecha').valueAsDate=new Date();

function filtrarEmpresas(){
  const q=document.getElementById('empresa').value.toLowerCase().trim();
  const dd=document.getElementById('dd');
  if(q.length<2){dd.style.display='none';return;}
  const res=CLIENTES.filter(c=>c.e.toLowerCase().includes(q)).slice(0,10);
  if(!res.length){dd.style.display='none';return;}
  dd.innerHTML=res.map(c=>{
    const idx=CLIENTES.indexOf(c);
    return `<div class="dd-item" onclick="selCliente(${idx})">${c.e}<span class="dd-ruc">${c.r}</span>${c.rb?`<span class="dd-rubro">${c.rb}</span>`:''}</div>`;
  }).join('');
  dd.style.display='block';
}

function selCliente(idx){
  const c=CLIENTES[idx];
  document.getElementById('empresa').value=c.e;
  document.getElementById('ruc').value=c.r;
  document.getElementById('planta').value=c.p;
  document.getElementById('dd').style.display='none';
}

document.addEventListener('click',e=>{if(!e.target.closest('.ac-wrap'))document.getElementById('dd').style.display='none';});

function addItem(){
  itemCount++;
  const n=itemCount;
  const tr=document.createElement('tr');
  tr.id=`item-${n}`;
  tr.innerHTML=`
    <td style="text-align:center;font-weight:700;color:#1a3c6e">${String(n).padStart(3,'0')}</td>
    <td><input type="text" value="MANTTO" placeholder="Tipo"></td>

function removeItem(n){const el=document.getElementById(`item-${n}`);if(el){el.remove();calcTotal();}}

function calcTotal(){
  let t=0;
  document.querySelectorAll('#itemsBody tr').forEach(tr=>{
    const ns=tr.querySelectorAll('input[type=number]');
    if(ns.length>=2)t+=(parseFloat(ns[0].value)||0)*(parseFloat(ns[1].value)||0);
  });
  document.getElementById('totalLive').textContent='$ '+t.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function fmtFecha(v){
  if(!v)return '';
  const[y,m,d]=v.split('-');
  const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const dt=new Date(y,m-1,d);
  return `Callao, ${dias[dt.getDay()]}, ${parseInt(d)} de ${meses[dt.getMonth()]} de ${y}`;
}

function fmtUSD(n){return '$ '+parseFloat(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}

async function generarPDF(){
  const rows=document.querySelectorAll('#itemsBody tr');
  if(!rows.length){alert('Agrega al menos un ítem.');return;}
  const asesoraName=document.getElementById('asesora').value;
  const asDat=ASESORAS.find(a=>a.n===asesoraName)||{tel:'',email:''};
  const numPres=document.getElementById('numPres').value||'000';
  const items=[];
  rows.forEach(tr=>{
    const txt=tr.querySelectorAll('input[type=text]');
    const nums=tr.querySelectorAll('input[type=number]');
    items.push({serv:txt[0]?.value||'',equipo:txt[1]?.value||'',desc:tr.querySelector('textarea')?.value||'',lugar:txt[2]?.value||'',cant:parseFloat(nums[0]?.value)||0,punit:parseFloat(nums[1]?.value)||0});
  });
  const d={numPres,fecha:fmtFecha(document.getElementById('fecha').value),empresa:document.getElementById('empresa').value,ruc:document.getElementById('ruc').value,planta:document.getElementById('planta').value,contacto:document.getElementById('contacto').value,cargo:document.getElementById('cargo').value,tel:document.getElementById('telCliente').value,asesora:asesoraName,asesoraTel:asDat.tel,asesoraEmail:asDat.email,formaPago:document.getElementById('formaPago').value,validez:document.getElementById('validez').value,diasCoord:document.getElementById('diasCoord').value,tiempo:document.getElementById('tiempoEst').value,personal:document.getElementById('personal').value};

  const ov=document.getElementById('overlay');
  const msg=document.getElementById('overlay-msg');
  ov.style.display='flex';

  buildHTML(d,items);
  await new Promise(r=>setTimeout(r,400));

  try{
    msg.textContent='Capturando página 1...';
    const c1=await html2canvas(document.getElementById('pres-p1'),{scale:2,backgroundColor:'#ffffff',logging:false});
    msg.textContent='Capturando página 2...';
    const c2=await html2canvas(document.getElementById('pres-p2'),{scale:2,backgroundColor:'#ffffff',logging:false});
    msg.textContent='Creando PDF...';
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=pdf.internal.pageSize.getWidth();
    const H=pdf.internal.pageSize.getHeight();
    pdf.addImage(c1.toDataURL('image/jpeg',0.95),'JPEG',0,0,W,H);
    pdf.addPage();
    pdf.addImage(c2.toDataURL('image/jpeg',0.95),'JPEG',0,0,W,H);
    pdf.save(`PRES-${numPres}.pdf`);
  }catch(err){
    alert('Error: '+err.message);
  }
  ov.style.display='none';
  document.getElementById('pres-p1').innerHTML='';
  document.getElementById('pres-p2').innerHTML='';
}

function abrirModalCliente(){document.getElementById('modalCliente').classList.add('open');}
function abrirModalAsesora(){document.getElementById('modalAsesora').classList.add('open');}
function cerrarModal(id){
  document.getElementById(id).classList.remove('open');
  ['nc-empresa','nc-ruc','nc-planta','nc-rubro','na-nombre','na-tel','na-email'].forEach(f=>{const el=document.getElementById(f);if(el)el.value='';});
}
function guardarCliente(){
  const emp=document.getElementById('nc-empresa').value.trim();
  const ruc=document.getElementById('nc-ruc').value.trim();
  const planta=document.getElementById('nc-planta').value.trim();
  const rb=document.getElementById('nc-rubro').value.trim();
  if(!emp){alert('La razón social es obligatoria.');return;}
  CLIENTES.push({e:emp,r:ruc,p:planta,rb});
  CLIENTES.sort((a,b)=>a.e.localeCompare(b.e));
  document.getElementById('empresa').value=emp;
  document.getElementById('ruc').value=ruc;
  document.getElementById('planta').value=planta;
  cerrarModal('modalCliente');
  alert(`✓ Cliente "${emp}" agregado.`);
}
function guardarAsesora(){
  const nombre=document.getElementById('na-nombre').value.trim();
  const tel=document.getElementById('na-tel').value.trim();
  const email=document.getElementById('na-email').value.trim();
  if(!nombre){alert('El nombre es obligatorio.');return;}
  ASESORAS.push({n:nombre,tel,email});
  renderAsesoras();
  document.getElementById('asesora').value=nombre;
  cerrarModal('modalAsesora');
  alert(`✓ Asesora "${nombre}" agregada.`);
}
